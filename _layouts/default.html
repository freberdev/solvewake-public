<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · SolveWake</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icon.png' | relative_url }}">
  <style>
    :root {
      --bg: #FBF7F2; --surface: #FFFFFF; --text: #1B1612; --muted: #6E6258;
      --accent: #E07B1F; --line: #E9E1D7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14110F; --surface: #241E19; --text: #F5EDE3; --muted: #A8998A;
        --accent: #FF9F45; --line: #3A322B;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px; }
    header { padding: 28px 0 8px; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 19px; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    nav { display: flex; gap: 18px; font-size: 15px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover, nav a[aria-current="page"] { color: var(--accent); }
    main { padding: 24px 0 48px; }
    h1 { font-size: 38px; font-weight: 300; line-height: 1.15; margin: 16px 0 8px; letter-spacing: -0.5px; }
    h2 { font-size: 21px; font-weight: 600; margin: 36px 0 8px; }
    h3 { font-size: 17px; font-weight: 600; margin: 24px 0 4px; }
    p, li { color: var(--text); }
    .muted, .updated { color: var(--muted); }
    .updated { font-size: 15px; margin-top: 0; }
    a { color: var(--accent); }
    ul { padding-left: 22px; }
    .card { background: var(--surface); border-radius: 18px; padding: 18px 22px; margin: 24px 0; }
    .card p { margin: 0; }
    .contact { font-size: 20px; font-weight: 600; }
    footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="bar">
        <a class="brand" href="{% if page.lang == 'sv' %}{{ '/sv/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">
          <img src="{{ '/assets/icon.png' | relative_url }}" alt="">SolveWake
        </a>
        <nav>
          {% if page.lang == 'sv' %}
            <a href="{{ '/sv/privacy/' | relative_url }}"{% if page.url == '/sv/privacy/' %} aria-current="page"{% endif %}>Integritet</a>
            <a href="{{ '/sv/support/' | relative_url }}"{% if page.url == '/sv/support/' %} aria-current="page"{% endif %}>Support</a>
          {% else %}
            <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
            <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
          {% endif %}
          {% if page.alt %}<a href="{{ page.alt | relative_url }}" lang="{% if page.lang == 'sv' %}en{% else %}sv{% endif %}">{% if page.lang == 'sv' %}English{% else %}Svenska{% endif %}</a>{% endif %}
        </nav>
      </div>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      © {{ site.time | date: '%Y' }} freber dev AB · <a href="mailto:support@freber.dev">support@freber.dev</a>
    </footer>
  </div>
</body>
</html>
